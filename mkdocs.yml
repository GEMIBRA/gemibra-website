site_name: GEMIBRA
site_url: https://gemibra.github.io/gemibra-website/

plugins:
  - search
  - macros
  - i18n:
      docs_structure: folder
      languages:
        - locale: pt
          default: true
          name: Português
          build: true
          link: /pt/
        - locale: en
          name: English
          build: true
          link: /en/
          nav_translations:
            Início: Home
            Dados: Data

nav:
  - Início: index.md
  - Dados: data.md

theme:
  name: material
  language: pt
